name: Build ShadowBooks Android APK

on:
  push:
    branches: [main, arena/4d1ad1ea-shadowbooks]
  workflow_dispatch:
    inputs:
      edition:
        description: 'Trial: one sample, no downloads. Full: textbooks, study PDFs, and Quran recitation.'
        type: choice
        options:
          - trial
          - full
        default: trial
        required: true

permissions:
  # Write access lets the full build refresh the fixed direct-download release below.
  contents: write

jobs:
  build:
    # Trial-branch pushes stay quiet unless explicitly tagged for a trial or a full build.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[trial-apk]') || contains(github.event.head_commit.message, '[full-apk]')
    runs-on: ubuntu-latest
    env:
      # Main builds full by default; this session branch opts into full only with [full-apk].
      FULL_BOOKS: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/arena/4d1ad1ea-shadowbooks' && contains(github.event.head_commit.message, '[full-apk]')) || (github.event_name == 'workflow_dispatch' && inputs.edition == 'full') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 35 SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Light app: only the pupil translation and Quran recitations stay bundled.
      # Textbooks and study PDFs are published separately by publish-store.yml.
      - name: Prepare bundled assets (pupil translation and Quran audio)
        if: env.FULL_BOOKS == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ASSET_MODE: light
        run: bash scripts/download_books.sh

      # The permanent signing key lives in the repo only encrypted. Without this one
      # secret the release build must stop: silently using any other key would break
      # updates for every installed phone.
      - name: Decrypt the permanent signing key
        if: env.FULL_BOOKS == 'true'
        env:
          SHADOWBOOKS_SIGNING_PASSWORD: ${{ secrets.SHADOWBOOKS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SHADOWBOOKS_SIGNING_PASSWORD:-}" ]; then
            echo "::error::Missing GitHub secret SHADOWBOOKS_SIGNING_PASSWORD. Add it under Settings > Secrets and variables > Actions so release builds can be signed with the permanent ShadowBooks key."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in keystore/shadowbooks-release.p12.enc \
            -out "$RUNNER_TEMP/shadowbooks-release.p12" \
            -pass env:SHADOWBOOKS_SIGNING_PASSWORD

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build the lightweight trial only
        if: env.FULL_BOOKS != 'true'
        run: bash ./gradlew --no-daemon :app:testTrialUnitTest :app:assembleTrial

      - name: Check trial contents, package ID and APK signature
        if: env.FULL_BOOKS != 'true'
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/trial/app-trial.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/trial-badging.txt"
          grep "^package: name='com.shadowbooks.trial'" "$RUNNER_TEMP/trial-badging.txt"
          cp "$apk" "$RUNNER_TEMP/ShadowBooks-Trial.apk"
          python3 scripts/verify_trial_apk.py "$RUNNER_TEMP/ShadowBooks-Trial.apk" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish trial APK
        if: env.FULL_BOOKS != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ShadowBooks-Trial-APK
          path: ${{ runner.temp }}/ShadowBooks-Trial.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Build release APK with offline books, study PDFs, and Quran audio
        if: env.FULL_BOOKS == 'true'
        env:
          SHADOWBOOKS_KEYSTORE_FILE: ${{ runner.temp }}/shadowbooks-release.p12
          SHADOWBOOKS_KEYSTORE_PASSWORD: ${{ secrets.SHADOWBOOKS_SIGNING_PASSWORD }}
          SHADOWBOOKS_KEY_ALIAS: shadowbooks
          SHADOWBOOKS_KEY_PASSWORD: ${{ secrets.SHADOWBOOKS_SIGNING_PASSWORD }}
        run: bash ./gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease

      - name: Verify the light APK bundles no store content
        if: env.FULL_BOOKS == 'true'
        run: python3 scripts/verify_light_apk.py --apk app/build/outputs/apk/release/app-release.apk

      - name: Verify packaged pupil translation and report actual sizes
        if: env.FULL_BOOKS == 'true'
        run: |
          set -eo pipefail
          python3 scripts/verify_prepared_book.py --apk app/build/outputs/apk/release/app-release.apk | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify packaged Quran recitation
        if: env.FULL_BOOKS == 'true'
        run: python3 scripts/verify_quran_audio.py --apk app/build/outputs/apk/release/app-release.apk | tee -a "$GITHUB_STEP_SUMMARY"

      # The printed certificate fingerprint must stay identical across releases;
      # it proves every update is signed with the same permanent key.
      - name: Verify release signature and non-debuggable packaging
        if: env.FULL_BOOKS == 'true'
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee -a "$GITHUB_STEP_SUMMARY"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/full-badging.txt"
          grep "^package: name='com.shadowbooks'" "$RUNNER_TEMP/full-badging.txt"
          if grep -q "application-debuggable" "$RUNNER_TEMP/full-badging.txt"; then
            echo "::error::Release APK is debuggable; refusing to publish it."
            exit 1
          fi

      - name: Publish full APK artifact
        if: env.FULL_BOOKS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ShadowBooks-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Build resumable downloader APK
        if: env.FULL_BOOKS == 'true'
        env:
          SHADOWBOOKS_KEYSTORE_FILE: ${{ runner.temp }}/shadowbooks-release.p12
          SHADOWBOOKS_KEYSTORE_PASSWORD: ${{ secrets.SHADOWBOOKS_SIGNING_PASSWORD }}
          SHADOWBOOKS_KEY_ALIAS: shadowbooks
          SHADOWBOOKS_KEY_PASSWORD: ${{ secrets.SHADOWBOOKS_SIGNING_PASSWORD }}
        run: bash ./gradlew --no-daemon :downloader:assembleRelease

      # Refresh one fixed release so the channel always shares the same direct links.
      # The tiny downloader fetches the large APK in resumable HTTP Range chunks; each
      # chunk starts from the permanent release URL and receives a fresh signed URL.
      - name: Publish direct-download release
        if: env.FULL_BOOKS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ShadowBooks.apk"
          cp downloader/build/outputs/apk/release/downloader-release.apk "$RUNNER_TEMP/ShadowBooks-Downloader.apk"
          release_notes="Recommended: install ShadowBooks-Downloader.apk first (tiny), open it, and let it download ShadowBooks for you. The downloader runs as a foreground service with parallel connections (much faster), resumes automatically if the network drops or the phone restarts, verifies the file, and saves ShadowBooks.apk into your phone's Downloads folder, ready to install. New in this version: the app itself is now light (~100 MB). Textbooks, summaries, and exam files moved into the built-in Store tab: download each book or file on its own (resumable, integrity-verified) and it lands in its exact place in the library or study sections, ready to read offline. Quran recitation, the English translation companion, the scientific calculator, and the class timetable remain built in. Note: content that used to be bundled must be downloaded once from the Store after updating; pick only what you need."
          if gh release view v1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.0 --repo "$GITHUB_REPOSITORY" --title "ShadowBooks 1.0" --notes "$release_notes"
            gh release upload v1.0 "$RUNNER_TEMP/ShadowBooks.apk" "$RUNNER_TEMP/ShadowBooks-Downloader.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.0 "$RUNNER_TEMP/ShadowBooks.apk" "$RUNNER_TEMP/ShadowBooks-Downloader.apk" --repo "$GITHUB_REPOSITORY" \
              --title "ShadowBooks 1.0" \
              --notes "$release_notes"
          fi
