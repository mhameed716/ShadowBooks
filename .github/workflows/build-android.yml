name: Build ShadowBooks Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 35 SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download all textbook PDFs into app assets
        run: bash scripts/download_books.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK with bundled books
        run: chmod +x ./gradlew && ./gradlew --no-daemon assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowBooks-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          compression-level: 0
